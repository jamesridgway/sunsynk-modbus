[project]
name = "sunsynk-modbus"
version = "0.1.0"
description = "Read Sunsynk single-phase hybrid inverters over Modbus, built on modbus-connection"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "James Ridgway", email = "jamesridgway@users.noreply.github.com" }]
keywords = ["sunsynk", "deye", "inverter", "modbus", "home-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["modbus-connection>=4.12"]

[project.optional-dependencies]
tmodbus = ["modbus-connection[tmodbus]>=4.12"]

[project.urls]
Source = "https://github.com/jamesridgway/sunsynk-modbus"
Issues = "https://github.com/jamesridgway/sunsynk-modbus/issues"

[dependency-groups]
dev = [
    "modbus-connection[tmodbus]>=4.12",
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=sunsynk_modbus --cov-report=term-missing"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
