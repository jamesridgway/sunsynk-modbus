name: Library bug report
description: Report a problem in the sunsynk-modbus library.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use this form only for problems in the library. For problems with the Sunsynk integration in Home Assistant, open an issue in Home Assistant Core.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Tell us what occurred and what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Library version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: inverter
    attributes:
      label: Inverter model
      description: The model on the rating label of the inverter.
      placeholder: SUNSYNK-3.6K-SG01LP1
    validations:
      required: true
  - type: input
    id: connection
    attributes:
      label: Connection
      description: How the library connects to the inverter. For example, a Modbus TCP gateway or a USB RS485 adapter.
  - type: textarea
    id: output
    attributes:
      label: Output of script/query.py
      description: Remove the serial number of the inverter before you send the output.
      render: text
